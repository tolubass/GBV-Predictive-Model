name: Super-Linter

# Run this workflow on push and pull requests to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run Super-Linter
      - name: Run Super-Linter
        uses: github/super-linter@v5
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only validate Python syntax errors (not style)
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_BLACK: false
          # Don't validate HTML styling
          VALIDATE_HTML: false
          # Keep markdown validation
          VALIDATE_MARKDOWN: true
          # Make flake8 less strict
          PYTHON_FLAKE8_CONFIG_FILE: .flake8
